name = "lockin-api"
main = "src/index.ts"
# Never a future date: Cloudflare refuses those, and `npm run dev`'s local runtime only knows dates
# up to its own release. Move it forward deliberately, with the tests and a deploy to check.
compatibility_date = "2026-10-01"

# Secrets: set each with `npx wrangler secret put <NAME>` (README.md). Never commit them.
#   APNS_TEAM_ID       your Apple Developer team ID, e.g. ABCDE12345
#   APNS_KEY_ID        the APNs key's 10-character ID
#   APNS_PRIVATE_KEY   the contents of AuthKey_XXXXXXXXXX.p8
#   ADMIN_TOKEN        32+ random characters; turns on POST /admin/push-test and
#                      /admin/push-to-start-test outside production
#   SIWA_KEY_ID        the Sign in with Apple key's 10-character ID (M2)
#   SIWA_PRIVATE_KEY   the contents of that key's AuthKey_XXXXXXXXXX.p8. With SIWA_KEY_ID, sign-in
#                      keeps Apple's refresh token so account deletion can revoke it (Apple requires
#                      that); without them sign-in still works and nothing is revoked
#   DEMO_BUDDY_CODE    the App Review code (docs/launch/app-review-notes.md §3): 8 characters of
#                      ABCDEFGHJKLMNPQRSTUVWXYZ23456789 (no 0, O, 1 or I), e.g. what
#                      `node -e "…"` in README.md prints. A secret so it isn't committed; change it
#                      for each submission. Works only with DEMO_BUDDY_ENABLED below
#   REVENUECAT_WEBHOOK_AUTH   M7: the exact Authorization value RevenueCat's webhook sends (set the
#                      same in RevenueCat → Integrations → Webhooks). Unset, the webhook answers 503
#   REVENUECAT_SECRET_KEY     M7: RevenueCat's secret API key (sk_…), for POST /me/plus/refresh.
#                      Unset, that answers 503 not_configured
# For `npm run dev`, put the same names in server/.dev.vars (gitignored) instead.

[vars]
# The app's bundle ID (LK_BUNDLE_ID), not the widget extension's: APNs pushes Live Activity
# updates to the topic "<this>.push-type.liveactivity", Sign in with Apple identity tokens must be
# for it, and universal links name "<APNS_TEAM_ID>.<this>".
APNS_BUNDLE_ID = "com.example.lockin"
# "production" turns off the /admin routes.
ENVIRONMENT = "development"
# The host invite links point at: https://<INVITE_HOST>/j/<code>. Leave it out until the invite
# domain exists (M9); links then use this Worker's own host, which serves the landing page too.
# INVITE_HOST = "lockin.app"
# M9: the app's App Store page. The home page (GET /) links to it, and so does the invite landing
# page. Until it's set, the home page shows an "[OWNER: App Store link]" placeholder and asks search
# engines not to index it, and the invite page links to a placeholder.
# APP_STORE_URL = "https://apps.apple.com/app/lockin/id1234567890"
# Demo Buddy's kill switch (docs/launch/app-review-notes.md §3): "true" turns the review code and
# the bot on; anything else, or leaving it out, turns them off (the code is then unknown, 404).
# Turn it on for App Review with DEMO_BUDDY_CODE set as a secret, and keep it on after approval.
# DEMO_BUDDY_ENABLED = "true"

# The web pages (src/pages.ts) are the Markdown drafts in docs/launch/, bundled as text. Deploy from
# a full checkout: they're outside server/, like the fixtures.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# POST /metrics (src/metrics.ts): at most 20 batches a minute from one IP address. Cloudflare keeps
# the counter (per location, not stored by us). A school's Wi-Fi shares one address, and the app
# sends one batch a day, so this is generous. The namespace_id is any number unique in the account.
[[ratelimits]]
name = "METRICS_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "lockin"
# Paste the database_id that `npx wrangler d1 create lockin` prints.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# One Room per session, solo or squad (M3, src/room.ts).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# One ApnsAuth, named "global": the APNs provider token every room presents (M3, src/apnsAuth.ts,
# docs/decisions/0004).
[[durable_objects.bindings]]
name = "APNS_AUTH"
class_name = "ApnsAuth"

# Durable Object class migrations (not D1's): SQLite-backed, which the Workers Free plan includes.
# Never edit or remove a tag once deployed; add a new one.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ApnsAuth"]
