# XcodeGen spec. The .xcodeproj is generated from this file and is not committed.
# Run `make project` after cloning and after editing this file.

name: Lockin

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: $(LK_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  LKKit:
    path: Packages/LKKit

targets:
  Lockin:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lockin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        # ProMotion: without this, iPhone apps are held to 60 frames a second.
        CADisableMinimumFrameDurationOnPhone: true
        # The system background, white or black with the phone's appearance, like Apple's apps.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The squad's live timers in the Dynamic Island and on the Lock Screen.
        NSSupportsLiveActivities: true
        # Lets people allow more frequent squad updates in Settings (devices.frequent_pushes).
        NSSupportsLiveActivitiesFrequentUpdates: true
        # lockin://... links from widgets, the Live Activity and invite links.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - lockin
        LKAppGroupIdentifier: $(LK_APP_GROUP)
        LKAPIHost: $(LK_API_HOST)
        LKAPNsEnvironment: $(LK_APNS_ENV)
        LKDeveloperTools: $(LK_DEVELOPER_TOOLS)
    entitlements:
      path: App/Lockin.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LK_APP_GROUP)
        # Xcode signs with "development"; exporting for App Store Connect switches it to
        # production, which is what TestFlight builds use.
        aps-environment: development
        # Accounts (M2): Sign in with Apple.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LK_BUNDLE_ID)
        PRODUCT_NAME: Lockin
        # iPhone only. This must be set on every target, not under the project's settings:
        # XcodeGen's iOS preset sets TARGETED_DEVICE_FAMILY "1,2" on each target, which would
        # override a project-level value and make the app an iPad app too.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: LKKit
        product: Core
      - package: LKKit
        product: Model
      - package: LKKit
        product: DesignSystem
      - package: LKKit
        product: Creature
      - package: LKKit
        product: LiveActivity
      - package: LKKit
        product: SessionEngine
      - package: LKKit
        product: Paywall
      - package: LKKit
        product: API
      - package: LKKit
        product: Social
      - package: LKKit
        product: DeepFocus
      - target: LockinWidgets

  # The Live Activity (every presentation), and later the Home/Lock Screen widgets and the
  # Control Center control. Runs in its own sandbox: no network, no location.
  LockinWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Lockin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LKAppGroupIdentifier: $(LK_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LK_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LK_BUNDLE_ID).widgets
        PRODUCT_NAME: LockinWidgets
        TARGETED_DEVICE_FAMILY: "1" # Per target, see Lockin.
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: LKKit
        product: Core
      - package: LKKit
        product: Model
      - package: LKKit
        product: DesignSystem
      - package: LKKit
        product: Creature
      - package: LKKit
        product: LiveActivity

  # Deep Focus (M8): draws the shield over an app you blocked.
  # Built on every CI run so it keeps compiling, but not embedded in the app (and not archived)
  # until Apple approves the Family Controls (Distribution) entitlement: see docs/milestones/M8.md.
  LockinShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: DeepFocusExtensions/ShieldConfiguration
    info:
      path: DeepFocusExtensions/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: Lockin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LKAppGroupIdentifier: $(LK_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: DeepFocusExtensions/ShieldConfiguration/ShieldConfiguration.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LK_APP_GROUP)
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LK_BUNDLE_ID).shieldconfig
        PRODUCT_NAME: LockinShieldConfiguration
        TARGETED_DEVICE_FAMILY: "1" # Per target, see Lockin.
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: LKKit
        product: Core
      - package: LKKit
        product: DeepFocus

  # Deep Focus (M8): handles the shield's buttons; "Open anyway" records a slip.
  # Built on every CI run so it keeps compiling, but not embedded in the app (and not archived)
  # until Apple approves the Family Controls (Distribution) entitlement: see docs/milestones/M8.md.
  LockinShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: DeepFocusExtensions/ShieldAction
    info:
      path: DeepFocusExtensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Lockin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LKAppGroupIdentifier: $(LK_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: DeepFocusExtensions/ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LK_APP_GROUP)
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LK_BUNDLE_ID).shieldaction
        PRODUCT_NAME: LockinShieldAction
        TARGETED_DEVICE_FAMILY: "1" # Per target, see Lockin.
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: LKKit
        product: Core
      - package: LKKit
        product: DeepFocus

  # Deep Focus (M8): applies and lifts the shields with the session.
  # Built on every CI run so it keeps compiling, but not embedded in the app (and not archived)
  # until Apple approves the Family Controls (Distribution) entitlement: see docs/milestones/M8.md.
  LockinActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: DeepFocusExtensions/ActivityMonitor
    info:
      path: DeepFocusExtensions/ActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: Lockin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LKAppGroupIdentifier: $(LK_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActivityMonitorExtension
    entitlements:
      path: DeepFocusExtensions/ActivityMonitor/ActivityMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LK_APP_GROUP)
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LK_BUNDLE_ID).activitymonitor
        PRODUCT_NAME: LockinActivityMonitor
        TARGETED_DEVICE_FAMILY: "1" # Per target, see Lockin.
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: LKKit
        product: Core
      - package: LKKit
        product: DeepFocus

  # Exports PNGs of screens for design review (see UITests/SnapshotExportTests.swift).
  LockinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1" # Per target, see Lockin.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(LK_BUNDLE_ID).uitests
    dependencies:
      - target: Lockin

schemes:
  Lockin:
    build:
      targets:
        Lockin: all
        LockinUITests: [test]
        # Deep Focus extensions: compiled with the tests so CI catches breakage, never archived
        # until they're embedded (M8.md).
        LockinShieldConfiguration: [test]
        LockinShieldAction: [test]
        LockinActivityMonitor: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LockinUITests
    archive:
      config: Release
